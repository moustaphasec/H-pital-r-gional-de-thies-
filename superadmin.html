<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dzcnlr1yz/image/upload/v1742394317/f1oy2jfpkujbopbqlrd2.png">
    <title>SuperAdmin - HealthSaaS Africa</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/additional-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; }
        #root { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .saas-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
        .saas-header h1 { font-size: 2rem; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        .saas-header h1 i { color: #2563eb; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/superadmin.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
</body>
</html>
